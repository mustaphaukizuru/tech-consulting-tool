# =============================
# APPLICATION
# =============================
spring.application.name=tech-consulting-tool
server.port=${PORT:8080}

# =============================
# DATABASE (PostgreSQL)
# =============================
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/consulting_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# =============================
# JWT
# =============================
app.jwt.secret=${JWT_SECRET:ukizuru-super-secret-key-change-in-production-32chars}
app.jwt.expiration=86400000

# =============================
# CORS
# =============================
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
