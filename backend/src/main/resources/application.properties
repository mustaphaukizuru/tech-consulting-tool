# =============================
# APPLICATION
# =============================
spring.application.name=tech-consulting-tool
server.port=${PORT:8080}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# =============================
# DATABASE (PostgreSQL)
# =============================
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/consulting_db}
spring.datasource.username=${DB_USERNAME:${PGUSER:postgres}}
spring.datasource.password=${DB_PASSWORD:${PGPASSWORD:postgres}}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# =============================
# JWT (REQUIRED env vars in prod)
# =============================
app.jwt.secret=${JWT_SECRET:dev-only-secret-do-not-use-in-prod-must-be-at-least-32-bytes}
app.jwt.expiration=${JWT_EXPIRATION_MS:3600000}
app.jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION_MS:604800000}
app.jwt.issuer=tech-consulting-tool

# =============================
# CORS
# =============================
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

# =============================
# Rate limiting
# =============================
app.rate-limit.login.capacity=10
app.rate-limit.login.refill-tokens=10
app.rate-limit.login.refill-period-minutes=1

# =============================
# Actuator
# =============================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when-authorized
management.info.env.enabled=true
management.info.git.mode=full

# =============================
# OpenAPI / Swagger
# =============================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

# =============================
# Logging
# =============================
logging.level.root=INFO
logging.level.com.ukizuru.consulting=DEBUG
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%X{traceId:-},%X{spanId:-}] %logger{36} - %msg%n

# =============================
# Error responses (Spring Boot 3 ProblemDetail)
# =============================
spring.mvc.problemdetails.enabled=true
server.error.include-message=always
server.error.include-binding-errors=on_param
